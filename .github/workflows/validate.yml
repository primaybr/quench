name: Validate

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  validate:
    name: Quench Validation Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python scripts/test_validate.py -v

      - name: Run E2E contributor sanity tests
        run: python scripts/test_cli_e2e.py -v

      - name: Run pre-commit hook tests
        run: python scripts/test_precommit_hooks.py -v

      - name: Run packaging tests
        run: python scripts/test_packaging.py -v

      - name: Run GitHub Action tests
        run: python scripts/test_action_yml.py -v

      - name: Run bootstrap script tests
        run: python scripts/test_bootstrap_scripts.py -v

      - name: Run global update tests
        run: python scripts/test_update_global.py -v

      - name: Run full repository scan
        run: python scripts/validate.py

      # Dogfooding: run the published composite Action (action.yml) the way users do.
      - name: Run quench Action on this repo
        uses: ./
        with:
          target: .

      # The Action must fail on a leak. The private-term fixture also proves the
      # private-terms input reaches the scanner. It is built outside the workspace.
      - name: Create leaking fixture
        run: |
          mkdir -p "$RUNNER_TEMP/quench-leaky"
          printf 'Look up cached data with hushcache_search first.\n' > "$RUNNER_TEMP/quench-leaky/CONTRIBUTING.md"

      - name: Run quench Action on the leaking fixture
        id: action_negative
        continue-on-error: true
        uses: ./
        with:
          target: ${{ runner.temp }}/quench-leaky
          private-terms: hushcache

      - name: Assert the Action rejected the fixture
        if: steps.action_negative.outcome != 'failure'
        run: |
          echo "::error::quench Action passed a fixture containing a configured private term"
          exit 1
