name: Quench Action
description: Run Quench defensive integrity harness (plaincast, leakguard, parity, hygiene) on repository files
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target:
    description: Target directory to scan
    required: false
    default: "."
  fix:
    description: Automatically fix plaincast typography and generic path leaks
    required: false
    default: "false"
  paths-only:
    description: Only check for path leaks and credentials
    required: false
    default: "false"
  private-terms:
    description: Comma-separated private tool or project names to flag as context bleed; pass from a secret
    required: false
    default: ""
  format:
    description: "Output format: 'text' for plain lines only, 'github' to also emit ::error annotations on PR diffs, 'json' for one machine-readable report with no annotations (default: github)"
    required: false
    default: "github"
  no-ignore:
    description: Bypass .quenchignore and scan all files
    required: false
    default: "false"
  staged:
    description: Scan only git-staged files (a CI checkout has none staged, so this is for local or hook runs; the run warns when it scans nothing)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Run quench check
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_FIX: ${{ inputs.fix }}
        INPUT_PATHS_ONLY: ${{ inputs.paths-only }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_NO_IGNORE: ${{ inputs.no-ignore }}
        INPUT_STAGED: ${{ inputs.staged }}
        # Read directly by the scanner; never echoed.
        QUENCH_PRIVATE_TERMS: ${{ inputs.private-terms }}
      run: |
        ARGS=()
        if [ -n "$INPUT_TARGET" ]; then
          ARGS+=("--target" "$INPUT_TARGET")
        fi
        if [ "$INPUT_FIX" = "true" ] || [ "$INPUT_FIX" = "True" ]; then
          ARGS+=("--fix")
        fi
        if [ "$INPUT_PATHS_ONLY" = "true" ] || [ "$INPUT_PATHS_ONLY" = "True" ]; then
          ARGS+=("--paths-only")
        fi
        if [ "$INPUT_NO_IGNORE" = "true" ] || [ "$INPUT_NO_IGNORE" = "True" ]; then
          ARGS+=("--no-ignore")
        fi
        if [ "$INPUT_STAGED" = "true" ] || [ "$INPUT_STAGED" = "True" ]; then
          ARGS+=("--staged")
        fi
        if [ -n "$INPUT_FORMAT" ]; then
          ARGS+=("--format" "$INPUT_FORMAT")
        fi

        status=0
        python "${{ github.action_path }}/quench.py" check "${ARGS[@]}" || status=$?

        # --fix edits files on the runner only. Show what changed; committing is left
        # to a later step in the calling workflow.
        if [ "$INPUT_FIX" = "true" ] || [ "$INPUT_FIX" = "True" ]; then
          if git -C "${INPUT_TARGET:-.}" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "${INPUT_TARGET:-.}" --no-pager diff --stat || true
          fi
          echo "::warning title=quench fix::fix: true rewrote files on the runner but did not commit them. Add a commit step after this action to keep the changes."
        fi

        exit $status
